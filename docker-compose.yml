services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-research-agent-postgres

    environment:
      POSTGRES_USER: research_agent
      POSTGRES_PASSWORD: research_agent
      POSTGRES_DB: research_agent

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U research_agent -d research_agent" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-research-agent-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
