[project]
name = "ai-research-agent"
version = "0.1.0"
description = "A bounded, citation-grounded AI research agent"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.15.0",
    "groq",
    "httpx>=0.28.1",
    "pydantic>=2",
    "python-dotenv>=1",
    "asyncpg>=0.30.0",
    "sentence-transformers>=6.1.0",
    "langgraph>=1.2.12",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
